name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # windows-latest 控制台默认 cp1252，脚本里的中文提示会触发 UnicodeEncodeError。
  # 强制 UTF-8 后 Linux / Windows 行为一致。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # 刻意不装 torch / ultralytics：转换管线与单测都是 CPU 纯逻辑，
      # headless opencv 足够。装 torch 会让作业时长翻几倍且没有任何额外覆盖。
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      # 挂了就把 pytest 摘要写成 workflow annotation。原因很实际：actions 的日志下载
      # 要鉴权（本地没有 token，直接 403），但 annotations 走公开 API 就能读到，
      # 等于把「哪几条挂了、挂在哪个断言」带回本地，不用去点网页。
      - name: Unit tests
        shell: bash
        run: |
          set +e
          log="${RUNNER_TEMP:-/tmp}/pytest.log"
          python -m pytest -q 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
          python - "$log" <<'PY'
          import pathlib, re, sys
          raw = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          lines = raw.splitlines()

          def esc(s, n):
              s = s.strip().replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              return s[:n] or "-"

          def ann(title, msg):
              print("::error title=" + title + "::" + msg)

          summary = [l for l in lines if re.match(r"^(FAILED|ERROR)\s", l)]
          ann("pytest-summary", esc(" | ".join(summary[:20]), 900))

          heads = [l.strip("_ ") for l in lines if re.match(r"^_+ .+ _+$", l)]
          ann("pytest-blocks", esc(" | ".join(heads[:12]), 600))

          elines = []
          for l in lines:
              s = l.strip()
              if s.startswith("E ") and s not in elines:
                  elines.append(s)
          for e in elines[:6]:
              ann("pytest-E", esc(e, 400))

          tail = [l for l in lines if l.strip()][-6:]
          ann("pytest-tail", esc(" | ".join(tail), 600))
          print("annotated: %d summary / %d blocks / %d E-lines"
                % (len(summary), len(heads), len(elines)), file=sys.stderr)
          PY
          fi
          exit "$code"

      - name: Guard - core lib must not import torch
        run: |
          python -c "import sys, induvision.mvtec; assert 'torch' not in sys.modules, 'mvtec.py pulled in torch'; print('ok: no torch dependency')"

      # 端到端冒烟：合成 MVTec 树 -> 校验 -> 转 YOLO-seg -> 断言产物完整。
      # 不下载真实数据集（4.9GB + CC BY-NC-SA 4.0 不可再分发）。
      - name: E2E smoke on synthetic MVTec tree
        run: |
          python tools/make_fake_mvtec.py --out ci-out/fake_mvtec
          python tools/download_mvtec.py --verify-only --dest ci-out/fake_mvtec --categories bottle screw
          python tools/convert_mvtec_to_yolo.py --src ci-out/fake_mvtec --out ci-out/yolo_fake --lenient

      - name: Assert dataset artifacts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("ci-out/yolo_fake")
          for name in ("data.yaml", "dataset_stats.json", "manifest.csv"):
              assert (root / name).is_file(), f"missing {name}"
          stats = json.loads((root / "dataset_stats.json").read_text(encoding="utf-8"))
          n_img = sum(len(list((root / "images" / s).glob("*"))) for s in ("train", "val", "test"))
          n_lbl = sum(len(list((root / "labels" / s).glob("*.txt"))) for s in ("train", "val", "test"))
          assert n_img == n_lbl == stats["totals"]["images_written"] > 0, (n_img, n_lbl)
          fid = stats["polygon"]["area_fidelity_mean"]
          assert 0.8 < fid <= 1.3, f"polygon fidelity out of range: {fid}"
          print(f"ok: {n_img} images / {n_lbl} labels / fidelity={fid}")
          PY
        shell: bash

      # 缺陷合成冒烟：在上一步的转换产物上跑 copy-paste。
      # 三次运行分别是「基准 / 同参数重跑 / 换并发度」，用来盯住可复现性与防泄漏。
      - name: E2E smoke on defect synthesis
        run: |
          python tools/synthesize_defects.py --src ci-out/yolo_fake --out ci-out/synth_w1 --cap-factor 2 --workers 1 --figures 2
          python tools/synthesize_defects.py --src ci-out/yolo_fake --out ci-out/synth_w1b --cap-factor 2 --workers 1 --figures 0
          python tools/synthesize_defects.py --src ci-out/yolo_fake --out ci-out/synth_w4 --cap-factor 2 --workers 4 --figures 0 --link copy

      - name: Assert synthesis artifacts
        run: |
          python - <<'PY'
          import csv, json, pathlib
          src = pathlib.Path("ci-out/yolo_fake")
          a, b, c = (pathlib.Path(f"ci-out/synth_{t}") for t in ("w1", "w1b", "w4"))

          def imgs(root, split):
              d = root / "images" / split
              return {p.name: p.read_bytes() for p in sorted(d.iterdir())} if d.is_dir() else {}

          def report(root):
              return json.loads((root / "synth_report.json").read_text(encoding="utf-8"))

          def rows(root):
              with (root / "synth_manifest.csv").open(encoding="utf-8", newline="") as fh:
                  return list(csv.DictReader(fh))

          for root in (a, b, c):
              for name in ("data.yaml", "synth_manifest.csv", "synth_report.json", "defect_bank.npz"):
                  assert (root / name).is_file(), f"missing {root / name}"

          ra = report(a)
          assert ra["bank"]["built_from"] == ["train"], ra["bank"]
          assert ra["synth_images"] == len(rows(a)) > 0
          for r in rows(a):
              assert r["split"] == "train"
              assert int(r["n_pasted"]) == int(r["polygons"]) >= 1, r
          fid = ra["polygon_area_fidelity"]["mean"]
          assert 0.5 < fid <= 1.3, f"polygon fidelity out of range: {fid}"
          n_fig = len(list((a / "figures").glob("*.png")))
          assert n_fig == 2, n_fig

          for rep in (ra, report(b), report(c)):
              assert all(v <= 0 for v in rep["remaining_quota"].values()), rep["remaining_quota"]
              for k, v0 in rep["instances_before"].items():
                  assert rep["instances_after"][k] >= v0, (k, v0, rep["instances_after"])

          # 防泄漏：val/test 与源数据集逐字节一致，合成图只出现在 train
          for split in ("val", "test"):
              assert imgs(a, split) == imgs(src, split), f"{split} split was polluted"
          extra = set(imgs(a, "train")) - set(imgs(src, "train"))
          assert extra and extra == {r["out_name"] for r in rows(a)}, extra

          # 跨进程可复现：同 seed + 同 workers -> 图像与 manifest 逐字节一致
          assert imgs(a, "train") == imgs(b, "train"), "rerun is not bit-reproducible"
          assert rows(a) == rows(b), "manifest differs between reruns"

          # 并发度只影响「合成到第几张停」，不影响每张图的内容
          shared = sorted(n for n in set(imgs(a, "train")) & set(imgs(c, "train")) if n.startswith("synth__"))
          assert shared, "no shared synth images between workers=1 and workers=4"
          ca, cc = imgs(a, "train"), imgs(c, "train")
          assert all(ca[n] == cc[n] for n in shared), "same seed_child produced different pixels"
          assert report(c)["synth_images"] >= ra["synth_images"]
          print(f"ok: {ra['synth_images']} synth imgs, fidelity={fid}, shared={len(shared)}, "
                f"instances {ra['instances_before']} -> {ra['instances_after']}")
          PY
        shell: bash
      - name: No dataset/weights leaked into repo
        run: |
          python - <<'PY'
          import subprocess
          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          bad = [f for f in tracked if f.startswith(("data/", "weights/", "out/", "runs/"))
                 and not f.endswith(("data/README.md",))]
          bad += [f for f in tracked if f.endswith((".pt", ".onnx", ".engine", ".trt"))]
          # 压测与排查过程中的草稿脚本/中间产物一律不入库（W4① 一轮就产生了 27 个 _tmp*）
          bad += [f for f in tracked if f.startswith("_tmp") or "/_tmp" in f]
          assert not bad, f"forbidden files tracked: {bad}"
          print(f"ok: {len(tracked)} tracked files, no dataset/weights/artifacts/scratch")
          PY
        shell: bash