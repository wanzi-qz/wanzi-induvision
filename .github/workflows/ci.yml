name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  # windows-latest 控制台默认 cp1252，脚本里的中文提示会触发 UnicodeEncodeError。
  # 强制 UTF-8 后 Linux / Windows 行为一致。
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-ci.txt

      # 刻意不装 torch / ultralytics：转换管线与单测都是 CPU 纯逻辑，
      # headless opencv 足够。装 torch 会让作业时长翻几倍且没有任何额外覆盖。
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt

      - name: Unit tests
        run: python -m pytest -q

      - name: Guard - core lib must not import torch
        run: |
          python -c "import sys, induvision.mvtec; assert 'torch' not in sys.modules, 'mvtec.py pulled in torch'; print('ok: no torch dependency')"

      # 端到端冒烟：合成 MVTec 树 -> 校验 -> 转 YOLO-seg -> 断言产物完整。
      # 不下载真实数据集（4.9GB + CC BY-NC-SA 4.0 不可再分发）。
      - name: E2E smoke on synthetic MVTec tree
        run: |
          python tools/make_fake_mvtec.py --out ci-out/fake_mvtec
          python tools/download_mvtec.py --verify-only --dest ci-out/fake_mvtec --categories bottle screw
          python tools/convert_mvtec_to_yolo.py --src ci-out/fake_mvtec --out ci-out/yolo_fake --lenient

      - name: Assert dataset artifacts
        run: |
          python - <<'PY'
          import json, pathlib, sys
          root = pathlib.Path("ci-out/yolo_fake")
          for name in ("data.yaml", "dataset_stats.json", "manifest.csv"):
              assert (root / name).is_file(), f"missing {name}"
          stats = json.loads((root / "dataset_stats.json").read_text(encoding="utf-8"))
          n_img = sum(len(list((root / "images" / s).glob("*"))) for s in ("train", "val", "test"))
          n_lbl = sum(len(list((root / "labels" / s).glob("*.txt"))) for s in ("train", "val", "test"))
          assert n_img == n_lbl == stats["totals"]["images_written"] > 0, (n_img, n_lbl)
          fid = stats["polygon"]["area_fidelity_mean"]
          assert 0.8 < fid <= 1.3, f"polygon fidelity out of range: {fid}"
          print(f"ok: {n_img} images / {n_lbl} labels / fidelity={fid}")
          PY
        shell: bash

      - name: No dataset/weights leaked into repo
        run: |
          python - <<'PY'
          import subprocess
          tracked = subprocess.run(["git", "ls-files"], capture_output=True, text=True, check=True).stdout.split()
          bad = [f for f in tracked if f.startswith(("data/", "weights/", "out/", "runs/"))
                 and not f.endswith(("data/README.md",))]
          bad += [f for f in tracked if f.endswith((".pt", ".onnx", ".engine", ".trt"))]
          assert not bad, f"forbidden files tracked: {bad}"
          print(f"ok: {len(tracked)} tracked files, no dataset/weights/artifacts")
          PY
        shell: bash